services:
  - type: web
    name: agrolens-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agrolens-db
          property: connectionString
      - key: ML_API_URL
        value: https://agrolens-ml.onrender.com
      - key: CORS_ORIGIN
        value: https://agrolens-mobile.onrender.com
      - key: DB_SSL
        value: "true"

  - type: web
    name: agrolens-ml
    env: python
    rootDir: ml-model
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port 5001
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: agrolens-db
    plan: free
    databaseName: agrolens
    user: agrolens_user